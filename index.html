<style>:root {
  --site-font: system-ui;
  font-family: var(--site-font), Avenir, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  font-weight: 400;
  color: #0f172a;
  background-color: #ffffff;
  --form-bg: #00000045;
  --form-border: #cbd5e1;
  --form-text: #0f172a;
  --form-placeholder: #1f2937;
  --form-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), inset 0 0 0 1px rgba(15, 23, 42, 0.02);
  --form-focus: rgba(59, 130, 246, 0.45);
  --button-bg: #1f2937;
  --button-bg-hover: #374151;
  --button-text: #e5e7eb;
  --button-border: #475569;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  font-weight: 500;
  color: #646cff;
  text-decoration: inherit;
}
a:hover {
  color: #535bf2;
}

body {
  margin: 0;

  place-items: center;
  min-width: 320px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: #1f2937;
  color: #e5e7eb;
}

h1 {
  font-size: 3.2em;
  line-height: 1.1;
}

button {
  border-radius: 12px;
  border: 1px solid var(--button-border);
  padding: 0.65em 1.2em;
  font-size: 0.98em;
  font-weight: 600;
  font-family: inherit;
  background-color: var(--button-bg);
  color: var(--button-text);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s, transform 0.05s;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12);
}
button:hover {
  border-color: #64748b;
  background-color: var(--button-bg);
}
button:focus,
button:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--form-focus);
}

/* High-visibility action buttons for save/create/submit flows */
.btn-primary,
button.text-purple {
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  color: #ffffff;
  border-color: #1d4ed8;
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.22);
}
.btn-primary:hover,
button.text-purple:hover {
  background: linear-gradient(135deg, #1e40af, #1d4ed8);
  border-color: #1e40af;
  color: #ffffff;
}
.btn-primary:disabled,
button.text-purple:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}
/* Make save actions easy to spot across the app */
button[id*="save" i],
button[data-action="save"],
button[data-action="save-job"] {
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  color: #ffffff;
  border-color: #1d4ed8;
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.22);
}
button[id*="save" i]:hover,
button[data-action="save"]:hover,
button[data-action="save-job"]:hover {
  background: linear-gradient(135deg, #1e40af, #1d4ed8);
  border-color: #1e40af;
  color: #ffffff;
}

.btn-close {
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  padding: 0 !important;
}
.btn-close:focus,
.btn-close:focus-visible {
  outline: none !important;
  box-shadow: none !important;
}

@media (prefers-color-scheme: light) {
  :root {
    color: #213547;
    background-color: #ffffff;
  }
  a:hover {
    color: #747bff;
  }
  button {
    background-color: #f9f9f9;
  }
}
input,
textarea,
select {
  display: block;
  width: auto;
  padding: 0.65rem 0.75rem;
  border: 1.5px solid var(--form-border);
  border-radius: 12px;
  margin-top: 0.35rem;
  max-width: 480px;
  background-color: var(--form-bg);
  color: var(--form-text);
  box-shadow: var(--form-shadow);
  transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
}

input::placeholder,
textarea::placeholder,
select::placeholder {
  color: var(--form-placeholder) !important;
  opacity: 1 !important;
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px var(--form-focus);
  background-color: #ffffff;
}
form > div {
  margin-bottom: 0.9rem;
}

label {
  font-weight: 400;
}

.role-button {
  display: inline-block;
  padding: 5px 8px;
  border: 1px solid #64748b;
  border-radius: 9999px;
  font-size: 11px;
  line-height: 1;
  color: #e2e8f0;
  background: rgba(30, 41, 59, 0.5);
}
form button {
 
  margin-top: 1rem;
}

button {
  border-radius: 12px;
  border: 1px solid var(--button-border);
  padding: 0.65em 1.2em;
  font-size: 0.98em;
  font-weight: 600;
  font-family: inherit;
  background-color: var(--button-bg);
  color: var(--button-text);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s, transform 0.05s;
  margin-top: 1rem;
  margin-right: 0.5rem;
}

/* Ensure outline-style buttons are always visible for secondary accent styles */
button.text-indigo-700,
button.text-indigo-600 {
  border-color: #c7d2fe;
  background-color: transparent;
}
button.text-indigo-700:hover,
button.text-indigo-600:hover {
  border-color: #818cf8;
}
/* Keep primary purple buttons filled; don't force transparent on hover */
button.text-purple:hover,
button.text-indigo-700:hover,
button.text-indigo-600:hover {
  border-color: inherit;
}

/* Make Tailwind width utilities take precedence */
input.w-full,
textarea.w-full,
select.w-full {
  width: 100% !important;
  max-width: 100% !important;
}

button:hover {
  border-color: #64748b;
  background-color: var(--button-bg-hover);
}

button:focus,
button:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--form-focus);
}

/* Light mode override */
/* Mobile: full-width buttons if needed */
@media (max-width: 640px) {
  button {
    width: 100%;
    margin-right: 0;
  }
}
body {
  margin: 0;
  padding: 1rem;
  place-items: center;
  min-width: 320px;
  min-height: 100vh;
  box-sizing: border-box;
  overflow-x: hidden;
}

#app {
  max-width: 100%;
  overflow-wrap: break-word;
  word-wrap: break-word;
  padding: 1rem;
  box-sizing: border-box;
  flex: 1 0 auto;
  width: 100%;
}
#site-footer,
footer {
  flex-shrink: 0;
  width: 100%;
}
#navbar {

}
#avatarPreview {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #ccc; /* or your preferred color */
  display: block;
}
